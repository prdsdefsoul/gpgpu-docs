site_name: GPGPU 软件栈中英双语文档
site_description: 一份面向异构计算初学者的 GPGPU 软件栈分层文档，中英双语，Docs-as-Code 实践
# GitHub Pages 把站点挂在 /gpgpu-docs/ 子路径下，
# 不设 site_url 的话语言切换器会生成 /en/ 这种根路径链接，点击 404
site_url: https://prdsdefsoul.github.io/gpgpu-docs/
site_author: Jiahui Li
repo_url: https://github.com/prdsdefsoul/gpgpu-docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_name: GPGPU Software Stack — Bilingual Docs
          theme:
            language: en
          nav_translations:
            首页: Home
            软件栈分层: Software Stack Layers
            分层总览: Layer Overview
            驱动层: Driver Layer
            Runtime 与执行模型: Runtime and Execution Model
            算子与编译层: Operators and Compilation
            框架接入层: Framework Integration
            示例验证: Worked Example
            分块归约: Tiled Reduction
            术语表: Glossary

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  # md_in_html 让 <div markdown> 内部的 Markdown 被正常解析，
  # 首页的卡片网格（grid cards）依赖它，否则会原样显示成纯文本
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  # 让 :material-xxx: 这类图标简写渲染成内联 SVG 图标
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - 首页: index.md
  - 软件栈分层:
      - 分层总览: stack/overview.md
      - 驱动层: stack/driver.md
      - Runtime 与执行模型: stack/runtime.md
      - 算子与编译层: stack/compiler.md
      - 框架接入层: stack/framework.md
  - 示例验证:
      - 分块归约: examples/tiled-reduction.md
  - 术语表: glossary.md
